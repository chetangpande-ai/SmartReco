<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{ subject }}</title></head>
{# Table layout and inline styles on purpose: email clients strip <style> blocks and
   have no meaningful flexbox support. #}
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="max-width:560px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e4e4ec;">

      <tr><td style="padding:22px 26px 6px;">
        <span style="color:#4f46e5;font-weight:700;font-size:15px;">&#9670; SmartReco</span>
      </td></tr>

      <tr><td style="padding:0 26px 4px;">
        <h1 style="margin:8px 0 10px;font-size:21px;line-height:1.3;color:#16161d;">{{ rec.headline }}</h1>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#3a3a48;">{{ rec.narrative }}</p>
      </td></tr>

      {% for entry in items %}
      {% set p = entry.product %}
      <tr><td style="padding:0 26px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="border:1px solid #e4e4ec;border-radius:10px;">
          <tr><td style="padding:14px 16px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6c6c7d;margin-bottom:5px;">
              {{ p.brand }} &middot; {{ p.category|track }} &middot; {{ p.tier }}
            </div>
            <a href="{{ base_url }}/products/{{ p.slug }}"
               style="font-size:16px;font-weight:600;color:#16161d;text-decoration:none;">{{ p.title }}</a>
            <p style="margin:7px 0 10px;font-size:13px;line-height:1.5;color:#6c6c7d;border-left:2px solid #4f46e5;padding-left:9px;">
              {{ entry.reason }}
            </p>
            <div style="font-size:13px;color:#16161d;font-weight:600;">
              ${{ '%.0f'|format(p.price_cents / 100) }}
              <span style="color:#6c6c7d;font-weight:400;">&nbsp;&#9733; {{ '%.1f'|format(p.rating) }}</span>
            </div>
          </td></tr>
        </table>
      </td></tr>
      {% endfor %}

      <tr><td style="padding:6px 26px 22px;">
        <a href="{{ base_url }}/me"
           style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;
                  padding:11px 20px;border-radius:9px;font-size:14px;font-weight:600;">
          {{ rec.cta or 'See all your picks' }}
        </a>
      </td></tr>

      <tr><td style="padding:0 26px 20px;">
        <div style="border-top:1px solid #e4e4ec;padding-top:14px;">
          <div style="font-size:12px;font-weight:600;color:#16161d;margin-bottom:7px;">Why you're seeing this</div>
          <ul style="margin:0;padding-left:18px;font-size:12px;line-height:1.7;color:#6c6c7d;">
            {% for fact in evidence %}<li>You {{ fact }}</li>{% endfor %}
          </ul>
        </div>
      </td></tr>

      <tr><td style="padding:14px 26px;background:#f4f4f7;font-size:11px;color:#6c6c7d;line-height:1.6;">
        Sent because you have digests turned on.
        <a href="{{ base_url }}/me" style="color:#6c6c7d;">Manage preferences</a>.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
