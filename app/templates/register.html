{% extends "base.html" %}
{% block title %}Create account — SmartReco{% endblock %}

{% block content %}
<div class="auth">
  <h1>Create your account</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
    <label>Name
      <input type="text" name="name" autocomplete="name" placeholder="Optional">
    </label>
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
      <small class="muted">At least 8 characters.</small>
    </label>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Sign in</a>.</p>
</div>
{% endblock %}
